[project]
name = "claude-brain"
version = "0.16.0"
description = "Unified, searchable SQLite archive of Claude Code session transcripts."
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "mcp>=2.3,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
